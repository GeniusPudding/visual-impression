# The process table is read a different way on each operating system, and that
# is the only platform-specific code here -- so it is tested on all three.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      # Proves the extension still packages, which is a separate failure mode
      # from the tests passing.
      - run: npx vsce package --no-dependencies --out /dev/null
        if: matrix.os == 'ubuntu-latest'
